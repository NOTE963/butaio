  for(const g of meat){const d=((g.x-p.x)**2+(g.y-p.y)**2)/9;if(d<bd){bd=d;tg=g}}
  let tx=tg?tg.x:WORLD/2,ty=tg?tg.y:WORLD/2;
  for(const q of pigs){if(q===p||q.m>p.m*.9)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);
   if(d<500&&d<Math.sqrt(bd)*1.5){const L=wid(q.m)*1.6+d*.3;tx=q.x+Math.cos(q.a)*L;ty=q.y+Math.sin(q.a)*L;break}}
  p.ta=Math.atan2(ty-p.y,tx-p.x)}
 const lp={x:p.x+Math.cos(p.a)*w*.9,y:p.y+Math.sin(p.a)*w*.9};
 for(const q of pigs){if(q===p||Math.hypot(q.x-p.x,q.y-p.y)>w+wid(q.m)+200)continue;
  for(const c of circles(q)){if(Math.hypot(lp.x-c.x,lp.y-c.y)<c.r+w*.3){p.ta=Math.atan2(lp.y-c.y,lp.x-c.x);p.ai=.15;return}}}
 const m=140;if(p.x<m||p.y<m||p.x>WORLD-m||p.y>WORLD-m)p.ta=Math.atan2(WORLD/2-p.y,WORLD/2-p.x)}
function update(dt){
 for(const p of pigs.slice()){
  if(p.rem){const sp=p.sf?0:170/Math.pow(1+p.m/400,.25),k=Math.min(1,dt*6);
   p.tx=cl(p.tx+Math.cos(p.ta)*sp*dt,0,WORLD);p.ty=cl(p.ty+Math.sin(p.ta)*sp*dt,0,WORLD);
   p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;p.a+=ang(p.ta-p.a)*k;continue}
  p.inv=Math.max(0,p.inv-dt);let ta;
  if(p===me){const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),jx=kx||ky?kx:joy.x,jy=kx||ky?ky:joy.y;ta=Math.hypot(jx,jy)>.15?Math.atan2(jy,jx):p.a}else{think(p,dt);ta=p.ta}
  const mt=3.8/(1+p.m/400)*dt;p.a+=cl(ang(ta-p.a),-mt,mt);
  let sp=165/Math.pow(1+p.m/400,.25);if(p.ch>0){p.ch-=dt;sp*=2.6}if(p.cd>0)p.cd-=dt;if(p===me&&(stp||keys.shift)&&!(p.ch>0))sp=0;p.stopped=sp===0;
  p.x=cl(p.x+Math.cos(p.a)*sp*dt,20,WORLD-20);p.y=cl(p.y+Math.sin(p.a)*sp*dt,20,WORLD-20);
  const h=nose(p),er=Math.max(22,wid(p.m)*.32);
  for(const g of grass)if(Math.abs(g.x-h.x)<er&&Math.abs(g.y-h.y)<er&&Math.hypot(g.x-h.x,g.y-h.y)<er){p.m+=.6;newGrass(g)}
  for(let i=meat.length-1;i>=0;i--){const g=meat[i];if(Math.abs(g.x-h.x)<er+6&&Math.hypot(g.x-h.x,g.y-h.y)<er+6){p.m+=g.v;meat.splice(i,1);
   if(p===me&&db&&g.k[0]!=='L')try{db.ref('d/'+g.k+'/e/'+g.i).set(1)}catch(e){}}}}
 for(const p of pigs.slice()){if(p.rem||p.dead||p.inv>0)continue;const h=nose(p);
  for(const q of pigs){if(q===p||q.inv>0||Math.abs(q.x-p.x)>400+wid(q.m))continue;
   if(circles(q).some(c=>Math.hypot(h.x-c.x,h.y-c.y)<c.r+h.r)){p.dead=1;break}}}
 for(const p of pigs.slice())if(p.dead)die(p);
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#2a4f26';ctx.fillRect(0,0,W,H);
 const f=me||{x:WORLD/2,y:WORLD/2,m:10},z=Math.min(W,H)/620*cl(1.15/(1+(wid(f.m)-56)/260),.3,1.1),cx=f.x,cy=f.y;
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
 ctx.fillStyle='#5fa043';ctx.fillRect(0,0,WORLD,WORLD);
 const vx0=cx-W/2/z,vx1=cx+W/2/z,vy0=cy-H/2/z,vy1=cy+H/2/z;
 ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=2;ctx.beginPath();
 for(let x=Math.max(0,Math.floor(vx0/100)*100);x<=Math.min(WORLD,vx1);x+=100){ctx.moveTo(x,Math.max(0,vy0));ctx.lineTo(x,Math.min(WORLD,vy1))}
 for(let y=Math.max(0,Math.floor(vy0/100)*100);y<=Math.min(WORLD,vy1);y+=100){ctx.moveTo(Math.max(0,vx0),y);ctx.lineTo(Math.min(WORLD,vx1),y)}
 ctx.stroke();
 ctx.strokeStyle='#1f7a22';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
 for(const g of grass){if(g.x<vx0||g.x>vx1||g.y<vy0||g.y>vy1)continue;const s=g.s*9;
  ctx.moveTo(g.x,g.y+s);ctx.lineTo(g.x-s*.6,g.y-s);ctx.moveTo(g.x,g.y+s);ctx.lineTo(g.x,g.y-s*1.3);ctx.moveTo(g.x,g.y+s);ctx.lineTo(g.x+s*.6,g.y-s)}
 ctx.stroke();
 for(const g of meat){if(g.x<vx0||g.x>vx1||g.y<vy0||g.y>vy1)continue;const r=7+g.v*.7;
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(g.x,g.y,r,0,6.3);ctx.fill();
  ctx.fillStyle='#f4a39a';ctx.beginPath();ctx.arc(g.x-r*.25,g.y-r*.25,r*.45,0,6.3);ctx.fill()}
 const vis=pigs.filter(p=>p.x>vx0-200&&p.x<vx1+200&&p.y>vy0-200&&p.y<vy1+200).sort((a,b)=>a.y-b.y);
 ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';
 for(const p of vis){const w=wid(p.m),h=w/AR,fl=Math.cos(p.a)>=0;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,h*.45,w*.45,h*.14,0,0,6.3);ctx.fill();
  ctx.rotate(fl?p.a:p.a+Math.PI);if(fl)ctx.scale(-1,1);
  if(p.inv>0&&p.inv<10&&Math.floor(t*10)%2)ctx.globalAlpha=.5;
  if(IMG.complete&&IMG.naturalWidth)ctx.drawImage(IMG,-w/2,-h/2,w,h);else{ctx.fillStyle='#f6a';ctx.fillRect(-w/2,-h/2,w,h)}
  ctx.restore();
  ctx.fillStyle=p===me?'#ffe14d':p.rem?'#9df':'#fff';const ny=p.y-h*.8-6;ctx.strokeText(p.name,p.x,ny);ctx.fillText(p.name,p.x,ny)}
 ctx.strokeStyle='#c33';ctx.lineWidth=10;ctx.strokeRect(0,0,WORLD,WORLD);ctx.restore()}
let last=0,lbT=0,saveT=4,botT=0,meatT=0;
function loop(ts){requestAnimationFrame(loop);if(!live)return;
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
 update(dt);if(!live)return;meatT-=dt;if(meatT<=0){meatT=.5;const n=now();meat=meat.filter(g=>g.ex>n)}draw();
 saveT-=dt;if(saveT<=0){saveT=4;saveSize()}
 sendT-=dt;if(sendT<=0&&db&&me){sendT=.25;const s=Math.round(me.x)+'|'+Math.round(me.y)+'|'+Math.round(me.a*100)+'|'+Math.floor(me.m)+'|'+(me.stopped?1:0)+'|'+myName.replace(/\|/g,'');
  if(s!==lastS){lastS=s;try{myRef.set(s)}catch(e){}}}
 botT-=dt;if(botT<=0){botT=1;let n=0;for(const p of pigs)if(p.bot)n++;while(n++<nBots())spawn(true,Math.floor(R(0,99)))}
 const c=$('ch');c.textContent=me.cd>0?Math.ceil(me.cd):'突進';c.style.opacity=me.cd>0?.5:1;
 lbT-=dt;if(lbT<=0){lbT=1;const s=pigs.slice().sort((a,b)=>b.m-a.m).slice(0,5);
  $('lb').innerHTML='オンライン '+(Object.keys(remote).length+1)+'人<br>'+s.map((p,i)=>`${i+1}. ${esc(p.name)} ${Math.floor(p.m)}`).join('<br>');
  $('sc').textContent='体重 '+Math.floor(me.m)+' kg　最高 '+Math.max(save.best,Math.floor(me.m))+' kg'}}
/* ---- 画面 ---- */
function show(id){for(const k of ['ov','ov2','rkv'])$(k).style.display=k===id?'flex':'none'}
function inGame(on){for(const k of ['js','hm','sc','lb','ch','st'])$(k).style.display=on?'block':'none'}
function showHome(){saveSize();live=false;leave();pushBest();show('ov');inGame(false);$('cur').textContent=(save.size>10?'現在の体重 '+save.size+' kg　':'')+(save.best?'最高記録 '+save.best+' kg':'')}
function startGame(){myName=(nm.value.trim()||'ぶた').slice(0,10);save.name=myName;persist();show(null);inGame(true);init();live=true;sendT=0;lastS='';botT=0;lbT=0;
 if(db){try{myRef.onDisconnect().remove()}catch(e){}pushBest()}}
function showRank(){const own='今週・生きているぶたのランキング<br>毎週月曜0時（日本時間）にリセット<br>自分の最高記録　'+save.best+' kg';$('rl').innerHTML=own+'<br>読み込み中...';show('rkv');
 if(!db)return void($('rl').innerHTML=own);
 let done=0;const tm=setTimeout(()=>{if(!done)$('rl').innerHTML=own+'<br>取得できませんでした'},6000);
 db.ref('r/'+WK).orderByChild('s').limitToLast(10).once('value',s=>{done=1;clearTimeout(tm);const a=[];s.forEach(c=>{a.push(c.val())});a.sort((x,y)=>y.s-x.s);
  $('rl').innerHTML=own+'<br><br>'+(a.length?a.map((r,i)=>`${i+1}位　${esc(r.n)}　${r.s} kg`).join('<br>'):'まだ記録がありません')},()=>{done=1;$('rl').innerHTML=own})}
const nm=$('nm');
$('go').onclick=$('go2').onclick=startGame;$('home2').onclick=$('hm').onclick=showHome;
$('rkb').onclick=showRank;$('rkback').onclick=()=>show('ov');
function charge(){if(me&&live&&!(me.cd>0)){me.ch=.6;me.cd=3}}
$('ch').onpointerdown=e=>{e.preventDefault();charge()};
$('st').onpointerdown=e=>{e.preventDefault();stp=1};
['pointerup','pointercancel','pointerleave'].forEach(n=>$('st').addEventListener(n,()=>stp=0));
const jsEl=$('js'),kn=$('kn');let jid=null;
function jmove(e){const r=jsEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),k=Math.min(1,d/(r.width/2));if(d>0){joy.x=dx/d*k;joy.y=dy/d*k}kn.style.left=(35+joy.x*35)+'px';kn.style.top=(35+joy.y*35)+'px'}
jsEl.addEventListener('pointerdown',e=>{jid=e.pointerId;jsEl.setPointerCapture(e.pointerId);jmove(e);e.preventDefault()});
jsEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
['pointerup','pointercancel'].forEach(n=>jsEl.addEventListener(n,e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;kn.style.left=kn.style.top='35px'}}));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'&&e.target.id!=='nm'){charge();e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
addEventListener('pagehide',()=>{saveSize();leave()});
load();nm.value=save.name;myName=save.name;showHome();requestAnimationFrame(loop);
</script></body></html>
